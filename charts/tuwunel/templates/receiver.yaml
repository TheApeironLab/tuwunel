{{- if .Values.alerts.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: matrix-alert-receiver-config
  namespace: {{ .Release.Namespace }}
data:
  config.yaml: |
    {{- .Files.Get "files/receiver.yaml" | replace "http://matrix-tuwunel.matrix.svc:8008" "http://matrix-tuwunel:8008" | nindent 4 }}
---
apiVersion: v1
kind: Service
metadata:
  name: matrix-alert-receiver
  namespace: {{ .Release.Namespace }}
  labels: {app: matrix-alert-receiver}   # ServiceMonitor 按它选（templates/monitoring.yaml）
spec:
  type: ClusterIP
  selector:
    app: matrix-alert-receiver
  ports:
  - name: http
    port: 3000
    targetPort: 3000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: matrix-alert-receiver
  namespace: {{ .Release.Namespace }}
  labels:
    app: matrix-alert-receiver
spec:
  replicas: 1
  selector:
    matchLabels:
      app: matrix-alert-receiver
  template:
    metadata:
      labels:
        app: matrix-alert-receiver
      annotations:
        checksum/config: {{ printf "%s%s" (.Files.Get "files/receiver.yaml") (.Files.Get "files/alerts.py") | sha256sum }}
    spec:
      automountServiceAccountToken: false
      imagePullSecrets: {{ toJson .Values.imagePullSecrets }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532    # distroless nonroot
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      initContainers:
      - name: initialize-alerts
        image: {{ include "matrix.image" (dict "context" . "role" "initializer") }}
        command: [python3, /initializer/alerts.py]
        env:
        - {name: MATRIX_DOMAIN, value: {{ .Values.domain | quote }}}
        - {name: MATRIX_TOKEN, valueFrom: {secretKeyRef: {name: matrix-appservice, key: as-token}}}
        - {name: BASIC_PASSWORD, valueFrom: {secretKeyRef: {name: {{ .Values.alerts.passwordSecret }}, key: password}}}
        securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: [ALL]}}
        resources: {requests: {cpu: 10m, memory: 32Mi}, limits: {memory: 128Mi}}
        volumeMounts:
        - {name: config, mountPath: /input, readOnly: true}
        - {name: initializer, mountPath: /initializer, readOnly: true}
        - {name: runtime, mountPath: /runtime}
      containers:
      - name: receiver
        image: {{ include "matrix.image" (dict "context" . "role" "receiver") }}
        imagePullPolicy: IfNotPresent
        args: [--config-path, /etc/receiver/config.yaml]
        ports:
        - name: http
          containerPort: 3000
        env:
        - name: MATRIX_USER_ID
          value: "@alertbot:{{ required "domain (SITE_DOMAIN) is required" .Values.domain }}"
        - name: MATRIX_ACCESS_TOKEN   # appservice 的 as_token（Tuwunel 认它就是 @alertbot）
          valueFrom:
            secretKeyRef: {name: matrix-appservice, key: as-token}
        - name: BASIC_PASSWORD        # 与 observability/matrix-alerts 同值（chentu.secrets SHARED_VALUES）
          valueFrom:
            secretKeyRef: {name: {{ .Values.alerts.passwordSecret }}, key: password}
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities: {drop: [ALL]}
        volumeMounts:
        - {name: runtime, mountPath: /etc/receiver, readOnly: true}
        readinessProbe:
          httpGet: {path: /metrics, port: 3000}
          periodSeconds: 10
        livenessProbe:
          httpGet: {path: /metrics, port: 3000}
          periodSeconds: 30
          failureThreshold: 3
        resources:
          requests:
            cpu: {{ .Values.receiver.cpuRequest }}
            memory: {{ .Values.receiver.memoryRequest }}
          limits:
            memory: {{ .Values.receiver.memoryLimit }}
      volumes:
      - {name: runtime, emptyDir: {medium: Memory}}
      - {name: initializer, configMap: {name: matrix-app-initializer}}
      - name: config
        configMap: {name: matrix-alert-receiver-config}

{{- end }}
