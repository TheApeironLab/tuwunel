apiVersion: v1
kind: ConfigMap
metadata:
  name: matrix-element-config
  namespace: {{ .Release.Namespace }}
data:
  config.json: |
    {{- include "matrix.elementConfig" . | nindent 4 }}
  well-known-client.json: |
    {{- include "matrix.wellKnownClient" . | nindent 4 }}
---
apiVersion: v1
kind: Service
metadata:
  name: matrix-element
  namespace: {{ .Release.Namespace }}
spec:
  type: ClusterIP
  selector:
    app: matrix-element
  ports:
  - name: http
    port: 8080
    targetPort: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: matrix-element
  namespace: {{ .Release.Namespace }}
  labels:
    app: matrix-element
spec:
  replicas: 1
  selector:
    matchLabels:
      app: matrix-element
  template:
    metadata:
      labels:
        app: matrix-element
      annotations:
        # subPath 挂载不会跟着 ConfigMap 更新，靠这个滚动
        checksum/config: {{ printf "%s%s" (include "matrix.elementConfig" .) (include "matrix.wellKnownClient" .) | sha256sum }}
    spec:
      automountServiceAccountToken: false
      imagePullSecrets: {{ toJson .Values.imagePullSecrets }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 101      # 镜像的 nginx 用户（USER 是名字，runAsNonRoot 需要数字 uid）
        runAsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: element
        image: {{ include "matrix.image" (dict "context" . "role" "element") }}
        imagePullPolicy: IfNotPresent
        env:
        - name: ELEMENT_WEB_PORT
          value: "8080"
        ports:
        - name: http
          containerPort: 8080
        securityContext:
          allowPrivilegeEscalation: false
          capabilities: {drop: [ALL]}
        volumeMounts:
        - {name: config, mountPath: /app/config.json, subPath: config.json, readOnly: true}
        - {name: config, mountPath: /usr/share/nginx/html/.well-known/matrix/client, subPath: well-known-client.json, readOnly: true}
        readinessProbe:
          httpGet: {path: /config.json, port: 8080}
          periodSeconds: 10
        livenessProbe:
          httpGet: {path: /version, port: 8080}
          periodSeconds: 30
          failureThreshold: 3
        resources:
          requests:
            cpu: {{ .Values.element.cpuRequest }}
            memory: {{ .Values.element.memoryRequest }}
          limits:
            memory: {{ .Values.element.memoryLimit }}
      volumes:
      - name: config
        configMap: {name: matrix-element-config}
