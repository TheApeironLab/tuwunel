{{- /* 告警通道自身的可观测性（N2 2026-10-03，MSG-7）：receiver 向 Tuwunel 投递失败时仍给 Alertmanager 回 200
（上游 handler/alerts.go），Alertmanager 记不到失败；所以抓取 receiver 的 /metrics，并对它的失败计数告警。
通道全断时这条告警同样发不进 #alerts，只能在 Prometheus/Grafana 看到（OBS/MSG 非目标）。没装 kps（无 CRD）时不渲染。 */ -}}
{{- if .Capabilities.APIVersions.Has "monitoring.coreos.com/v1" }}
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: matrix-alert-receiver
  namespace: {{ .Release.Namespace }}
spec:
  selector:
    matchLabels: {app: matrix-alert-receiver}
  endpoints:
  - port: http
    path: /metrics
    interval: 30s
---
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: matrix-alert-delivery
  namespace: {{ .Release.Namespace }}
spec:
  groups:
  - name: matrix-alert-delivery
    rules:
    - alert: MatrixAlertDeliveryFailing
      # join 失败计数是带标签的 CounterVec，第一次失败前没有序列：两项各自 or vector(0)，否则空集相加永远不触发
      expr: ((sum(increase(matrix_alertmanager_receiver_send_failure_total[10m])) or vector(0)) + (sum(increase(matrix_alertmanager_receiver_join_room_failure_total[10m])) or vector(0))) > 0
      for: 1m
      labels: {severity: warning}
      annotations:
        summary: matrix-alert-receiver 投递到 #alerts 失败（Alertmanager 侧看不到失败）
        runbook: stack/matrix/RUNBOOK.md「告警没进 #alerts」
{{- end }}
